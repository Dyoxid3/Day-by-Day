    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="theme-color" content="#1ea9e0" />
    <link rel="stylesheet" href="/style.css">
    <title>Day by Day</title>
</head>

    <div id="app">

    </div>

</body>
</html>
