# Hosting on Render (render.com), so the game can be played from any computer with just a link.
# In Render: New > Blueprint, pick this repository, and paste your Gemini key when it asks for GEMINI_API_KEY.
# The key stays in Render's settings; it's never in this repository or sent to players' browsers.
services:
  - type: web
    name: day-by-day
    runtime: node
    plan: free
    buildCommand: npm install && npm run build-nolog
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
